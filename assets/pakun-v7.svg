<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210">
  <defs>
    <filter id="strong-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .group {
        transform-origin: 460px 105px;
      }
      .base {
        font-family: Impact, Haettenschweiler, "Arial Black", "Arial Narrow Bold", sans-serif;
        font-size: 118px;
        font-weight: 900;
        letter-spacing: 10px;
        fill: #8B0000;
        stroke: #5c0000;
        stroke-width: 3.5;
        paint-order: stroke fill;
        filter: url(#strong-glow);
      }
      .glitch1, .glitch2 {
        font-family: Impact, Haettenschweiler, "Arial Black", "Arial Narrow Bold", sans-serif;
        font-size: 118px;
        font-weight: 900;
        letter-spacing: 10px;
        opacity: 0.75;
      }
      .glitch1 { fill: #ff003c; stroke: #ff003c; stroke-width: 2; }
      .glitch2 { fill: #00f0ff; stroke: #00f0ff; stroke-width: 2; }
      .line {
        stroke: #ff003c;
        stroke-width: 2.5;
        opacity: 0.65;
      }
      @media (prefers-reduced-motion: no-preference) {
        .base {
          animation: aggressive-pulse 1.8s ease-in-out infinite;
        }
        .glitch1 {
          animation: glitch-1 2.4s infinite linear alternate-reverse;
        }
        .glitch2 {
          animation: glitch-2 3s infinite linear alternate-reverse;
        }
        .line {
          animation: scan 2.2s linear infinite;
        }
        .group {
          animation: none;
          transform: scaleX(1.45);
        }
      }
      @keyframes aggressive-pulse {
        0%, 100% { fill: #5c0000; stroke: #3a0000; opacity: 0.9; }
        40% { fill: #ff1a1a; stroke: #b30000; opacity: 1; }
        60% { fill: #c40000; stroke: #8B0000; opacity: 1; }
      }
      @keyframes glitch-1 {
        0%, 100% { transform: translate(0); opacity: 0; }
        92% { transform: translate(0); opacity: 0; }
        93% { transform: translate(-7px, 2px); opacity: 0.85; }
        94% { transform: translate(6px, -3px); opacity: 0.65; }
        95% { transform: translate(-5px, 1px); opacity: 0.9; }
        96% { transform: translate(0); opacity: 0; }
      }
      @keyframes glitch-2 {
        0%, 100% { transform: translate(0); opacity: 0; }
        88% { transform: translate(0); opacity: 0; }
        89% { transform: translate(8px, -2px); opacity: 0.75; }
        90% { transform: translate(-6px, 3px); opacity: 0.55; }
        91% { transform: translate(4px, -1px); opacity: 0.85; }
        92% { transform: translate(0); opacity: 0; }
      }
      @keyframes scan {
        0% { transform: translateY(-70px); opacity: 0; }
        15% { opacity: 0.75; }
        85% { opacity: 0.75; }
        100% { transform: translateY(70px); opacity: 0; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <g class="group">
    <text x="460" y="126" text-anchor="middle" class="glitch1">PAKUN</text>
    <text x="460" y="126" text-anchor="middle" class="glitch2">PAKUN</text>
    <text x="460" y="126" text-anchor="middle" class="base">PAKUN</text>
  </g>
  <line class="line" x1="30" y1="42" x2="890" y2="42"/>
  <line class="line" x1="30" y1="158" x2="890" y2="158" style="animation-delay: -1.1s"/>
</svg>