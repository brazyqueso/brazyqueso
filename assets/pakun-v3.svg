<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <defs>
    <filter id="strong-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .base {
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
        font-size: 110px;
        font-weight: 900;
        letter-spacing: 8px;
        fill: #8B0000;
        filter: url(#strong-glow);
      }
      .glitch1, .glitch2 {
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
        font-size: 110px;
        font-weight: 900;
        letter-spacing: 8px;
        opacity: 0.7;
      }
      .glitch1 { fill: #ff003c; }
      .glitch2 { fill: #00f0ff; }
      .line {
        stroke: #ff003c;
        stroke-width: 2;
        opacity: 0.6;
      }
      @media (prefers-reduced-motion: no-preference) {
        .base {
          animation: aggressive-pulse 1.8s ease-in-out infinite;
        }
        .glitch1 {
          animation: glitch-1 2.4s infinite linear alternate-reverse;
        }
        .glitch2 {
          animation: glitch-2 3s infinite linear alternate-reverse;
        }
        .line {
          animation: scan 2.2s linear infinite;
        }
      }
      @keyframes aggressive-pulse {
        0%, 100% { fill: #5c0000; opacity: 0.85; }
        40% { fill: #ff1a1a; opacity: 1; }
        60% { fill: #b30000; opacity: 1; }
      }
      @keyframes glitch-1 {
        0%, 100% { transform: translate(0); opacity: 0; }
        92% { transform: translate(0); opacity: 0; }
        93% { transform: translate(-6px, 2px); opacity: 0.8; }
        94% { transform: translate(5px, -3px); opacity: 0.6; }
        95% { transform: translate(-4px, 1px); opacity: 0.9; }
        96% { transform: translate(0); opacity: 0; }
      }
      @keyframes glitch-2 {
        0%, 100% { transform: translate(0); opacity: 0; }
        88% { transform: translate(0); opacity: 0; }
        89% { transform: translate(7px, -2px); opacity: 0.7; }
        90% { transform: translate(-5px, 3px); opacity: 0.5; }
        91% { transform: translate(3px, -1px); opacity: 0.8; }
        92% { transform: translate(0); opacity: 0; }
      }
      @keyframes scan {
        0% { transform: translateY(-60px); opacity: 0; }
        15% { opacity: 0.7; }
        85% { opacity: 0.7; }
        100% { transform: translateY(60px); opacity: 0; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="glitch1">PAKUN</text>
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="glitch2">PAKUN</text>
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="base">PAKUN</text>
  <line class="line" x1="60" y1="45" x2="660" y2="45"/>
  <line class="line" x1="60" y1="145" x2="660" y2="145" style="animation-delay: -1.1s"/>
</svg>