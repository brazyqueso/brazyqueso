<svg xmlns="http://www.w3.org/2000/svg" width="620" height="160" viewBox="0 0 620 160">
  <defs>
    <style>
      .title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 92px;
        font-weight: 800;
        letter-spacing: 10px;
        fill: #8B0000;
      }
      @media (prefers-reduced-motion: no-preference) {
        .title {
          animation: pulse 2.8s ease-in-out infinite;
        }
      }
      @keyframes pulse {
        0%, 100% { fill: #6B0000; opacity: 0.85; }
        50% { fill: #B22222; opacity: 1; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" class="title">PAKUN</text>
</svg>