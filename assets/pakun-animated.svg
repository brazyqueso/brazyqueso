<svg xmlns="http://www.w3.org/2000/svg" width="700" height="180" viewBox="0 0 700 180">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 96px;
        font-weight: 800;
        letter-spacing: 14px;
        fill: #9B1B1B;
        filter: url(#glow);
      }
      .scan {
        fill: none;
        stroke: #C41E1E;
        stroke-width: 1.5;
        opacity: 0.35;
      }
      @media (prefers-reduced-motion: no-preference) {
        .title {
          animation: pulse 3.2s ease-in-out infinite;
        }
        .scan {
          animation: scanline 4s linear infinite;
        }
      }
      @keyframes pulse {
        0%, 100% { 
          fill: #6B1010; 
          opacity: 0.9;
        }
        50% { 
          fill: #C41E1E; 
          opacity: 1;
        }
      }
      @keyframes scanline {
        0% { transform: translateY(-40px); opacity: 0; }
        20% { opacity: 0.4; }
        80% { opacity: 0.4; }
        100% { transform: translateY(40px); opacity: 0; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" class="title">PAKUN</text>
  <rect class="scan" x="80" y="70" width="540" height="2"/>
</svg>